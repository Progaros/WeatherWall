when:
  event: [push, pull_request, tag]

steps:
  - name: setup
    image: ghcr.io/cirruslabs/android-sdk:35
    environment:
      GRADLE_USER_HOME: .gradle
    commands:
      - |
        if [ ! -f "./gradlew" ]; then
          echo "Downloading Gradle wrapper..."
          mkdir -p gradle/wrapper
          curl -sL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradle/wrapper/gradle-wrapper.jar
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
          curl -sL -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradlew
          chmod +x gradlew
        fi
      - chmod +x ./gradlew

  - name: test
    image: ghcr.io/cirruslabs/android-sdk:35
    environment:
      GRADLE_USER_HOME: .gradle
    commands:
      - ./gradlew test --no-daemon --stacktrace

  - name: assembleDebug
    image: ghcr.io/cirruslabs/android-sdk:35
    environment:
      GRADLE_USER_HOME: .gradle
    commands:
      - ./gradlew assembleDebug --no-daemon --stacktrace
      - ls -lah app/build/outputs/apk/debug || true
      - cp app/build/outputs/apk/debug/app-debug.apk WeatherWall-debug.apk
      - echo "APK built successfully!"
      - du -h WeatherWall-debug.apk
      - sha256sum WeatherWall-debug.apk

  - name: publish-release
    image: thegeeklab/wp-gitea-release
    settings:
      base_url: https://git.olli.info
      api_key:
        from_secret: forgejo_token
      files:
        - WeatherWall-debug.apk
      title: "Dev Build ${CI_COMMIT_SHA:0:8}"
      note: |
        Automated build from commit ${CI_COMMIT_SHA}
        Branch: ${CI_COMMIT_BRANCH}
    when:
      - event: push
        branch: main
