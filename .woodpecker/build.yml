when:
  event: [push, pull_request, tag]

variables:
  - &image 'ghcr.io/cirruslabs/android-sdk:35'
  - &gradle_home '/woodpecker/src/.gradle' # Store cache in the workspace volume

steps:
  # 1. Restore cache (Optional but recommended if you have a cache plugin)
  # If not, the first step below will act as the "warmer" for subsequent steps

  # 2. Setup & Download Dependencies (Once)
  - name: prepare
    image: *image
    environment:
      GRADLE_USER_HOME: *gradle_home
    commands:
      # Fix permissions if needed, ensure gradlew is executable
      - chmod +x gradlew
      # Download dependencies once so other steps are fast
      - ./gradlew dependencies --no-daemon
      # Copy specific Android licenses if missing (common CI issue)
      - yes | sdkmanager --licenses || true

  # 3. Lint
  - name: lint
    image: *image
    environment:
      GRADLE_USER_HOME: *gradle_home
    commands:
      - ./gradlew lintDebug --no-daemon
    when:
      event: [pull_request, push]

  # 4. Test
  - name: test
    image: *image
    environment:
      GRADLE_USER_HOME: *gradle_home
    commands:
      - ./gradlew testDebugUnitTest --no-daemon

  # 5. Build APK
  - name: build
    image: *image
    environment:
      GRADLE_USER_HOME: *gradle_home
    commands:
      - ./gradlew assembleDebug --no-daemon
      # Extract version and rename APK for release
      - VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
      - echo "$VERSION" > .version
      - cp app/build/outputs/apk/debug/app-debug.apk "WeatherWall-v$VERSION.apk"

  # 6. Publish (Only on push to main/develop)
  - name: release
    image: curlimages/curl:8.6.0 # Lighter image for just curl
    environment:
      FORGEJO_TOKEN:
        from_secret: forgejo_token
    commands:
      - VERSION=$(cat .version)
      - APK_FILE="WeatherWall-v$VERSION.apk"
      - |
        # Check if release exists
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token $FORGEJO_TOKEN" "https://git.olli.info/api/v1/repos/Oliver/WeatherWall/releases/tags/v$VERSION")
        if [ "$HTTP_CODE" = "200" ]; then echo "Release v$VERSION exists."; exit 0; fi

        # Create Release
        echo "Creating release v$VERSION..."
        RESP=$(curl -s -X POST -H "Authorization: token $FORGEJO_TOKEN" -H "Content-Type: application/json" -d "{\"tag_name\": \"v$VERSION\", \"name\": \"v$VERSION\", \"body\": \"Automated release v$VERSION\"}" "https://git.olli.info/api/v1/repos/Oliver/WeatherWall/releases")
        REL_ID=$(echo "$RESP" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)

        # Upload Asset
        if [ ! -z "$REL_ID" ]; then
          curl -s -X POST -H "Authorization: token $FORGEJO_TOKEN" -H "Content-Type: application/octet-stream" --data-binary "@$APK_FILE" "https://git.olli.info/api/v1/repos/Oliver/WeatherWall/releases/$REL_ID/assets?name=$APK_FILE"
          echo "Published successfully."
        fi
    when:
      branch: [main, develop]
      event: push
