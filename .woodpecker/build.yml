when:
  event: [push, pull_request]

steps:
  - name: setup
    image: ghcr.io/cirruslabs/android-sdk:35
    environment:
      GRADLE_USER_HOME: .gradle
    commands:
      - |
        if [ ! -f "./gradlew" ]; then
          echo "Downloading Gradle wrapper..."
          mkdir -p gradle/wrapper
          curl -sL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradle/wrapper/gradle-wrapper.jar
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
          curl -sL -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradlew
          chmod +x gradlew
        fi
      - chmod +x ./gradlew

  - name: test
    image: ghcr.io/cirruslabs/android-sdk:35
    environment:
      GRADLE_USER_HOME: .gradle
    commands:
      - ./gradlew test --no-daemon --stacktrace

  - name: assembleDebug
    image: ghcr.io/cirruslabs/android-sdk:35
    environment:
      GRADLE_USER_HOME: .gradle
    commands:
      - ./gradlew assembleDebug --no-daemon --stacktrace
      - ls -lah app/build/outputs/apk/debug || true
      - cp app/build/outputs/apk/debug/app-debug.apk WeatherWall-debug.apk
      - echo "APK built successfully!"
      - echo "To download, create a release on Forgejo and attach WeatherWall-debug.apk"

  - name: release
    image: ghcr.io/cirruslabs/android-sdk:35
    when:
      - event: push
        branch: main
    secrets: [forgejo_token]
    commands:
      - |
        if [ -n "$FORGEJO_TOKEN" ]; then
          VERSION=$(date +%Y.%m.%d)-$(echo $CI_COMMIT_SHA | cut -c1-7)
          echo "Creating release $VERSION..."
          curl -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"v$VERSION\",\"name\":\"WeatherWall $VERSION\",\"body\":\"Automated build from commit $CI_COMMIT_SHA\",\"draft\":false,\"prerelease\":true}" \
            "https://git.olli.info/api/v1/repos/Oliver/WeatherWall/releases" || echo "Release creation skipped"
        else
          echo "No FORGEJO_TOKEN secret configured. Skipping release creation."
          echo "To enable automatic releases, add a FORGEJO_TOKEN secret in Woodpecker CI settings."
        fi
