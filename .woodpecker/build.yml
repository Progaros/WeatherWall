when:
  event: [push, pull_request, tag]

steps:
  - name: setup
    image: ghcr.io/cirruslabs/android-sdk:35
    environment:
      GRADLE_USER_HOME: .gradle
    commands:
      - |
        if [ ! -f "./gradlew" ]; then
          echo "Downloading Gradle wrapper..."
          mkdir -p gradle/wrapper
          curl -sL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradle/wrapper/gradle-wrapper.jar
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
          curl -sL -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradlew
          chmod +x gradlew
        fi
      - chmod +x ./gradlew

  - name: test
    image: ghcr.io/cirruslabs/android-sdk:35
    environment:
      GRADLE_USER_HOME: .gradle
    commands:
      - ./gradlew test --no-daemon --stacktrace

  # Build debug APK on all branches
  - name: assembleDebug
    image: ghcr.io/cirruslabs/android-sdk:35
    environment:
      GRADLE_USER_HOME: .gradle
    commands:
      - ./gradlew assembleDebug --no-daemon --stacktrace
      - ls -lah app/build/outputs/apk/debug || true
      - |
        VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
        echo "Detected version: v$VERSION"
        echo "$VERSION" > .version
        BRANCH="${CI_COMMIT_BRANCH:-unknown}"
        if [ "$BRANCH" = "develop" ]; then
          APK_NAME="WeatherWall-nightly-v${VERSION}-debug.apk"
        else
          APK_NAME="WeatherWall-v${VERSION}-debug.apk"
        fi
        cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
        echo "Debug APK built: $APK_NAME"
        ls -la WeatherWall-*.apk
        sha256sum WeatherWall-*.apk

  # Build release APK only on main and develop branches
  - name: assembleRelease
    image: ghcr.io/cirruslabs/android-sdk:35
    environment:
      GRADLE_USER_HOME: .gradle
    commands:
      - ./gradlew assembleRelease --no-daemon --stacktrace
      - ls -lah app/build/outputs/apk/release || true
      - |
        VERSION=$(cat .version)
        echo "Detected version: v$VERSION"
        BRANCH="${CI_COMMIT_BRANCH:-unknown}"
        if [ "$BRANCH" = "develop" ]; then
          APK_NAME="WeatherWall-nightly-v${VERSION}.apk"
        else
          APK_NAME="WeatherWall-v${VERSION}.apk"
        fi
        cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
        echo "Release APK built: $APK_NAME"
        ls -la WeatherWall-*.apk
        sha256sum WeatherWall-*.apk
    when:
      - event: push
        branch: [main, develop]
      - event: tag

  # Publish release on main branch only
  - name: publish-release
    image: ghcr.io/cirruslabs/android-sdk:35
    environment:
      FORGEJO_TOKEN:
        from_secret: forgejo_token
    commands:
      - |
        VERSION=$(cat .version)
        APK_FILE="WeatherWall-v${VERSION}.apk"
        echo "Checking if release v$VERSION exists..."
        echo "APK file: $APK_FILE"
        ls -la "$APK_FILE" || { echo "APK not found!"; exit 1; }
        
        EXISTING=$(curl -s -o /dev/null -w "%{http_code}" \
          -H "Authorization: token $FORGEJO_TOKEN" \
          "https://git.olli.info/api/v1/repos/Oliver/WeatherWall/releases/tags/v${VERSION}"\)
        
        if [ "$EXISTING" = "200" ]; then
          echo "Release v$VERSION already exists, skipping publish"
          exit 0
        fi
        
        echo "Creating new release v$VERSION..."
        
        RELEASE_RESPONSE=$(curl -s -X POST \
          -H "Authorization: token $FORGEJO_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"tag_name\": \"v${VERSION}\", \"name\": \"v${VERSION}\", \"body\": \"Automated release v${VERSION}\"}" \
          "https://git.olli.info/api/v1/repos/Oliver/WeatherWall/releases"\)
        
        RELEASE_ID=$(echo "$RELEASE_RESPONSE" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
        
        if [ -z "$RELEASE_ID" ]; then
          echo "Failed to create release"
          echo "$RELEASE_RESPONSE"
          exit 1
        fi
        
        echo "Created release ID: $RELEASE_ID"
        
        curl -s -X POST \
          -H "Authorization: token $FORGEJO_TOKEN" \
          -H "Content-Type: application/octet-stream" \
          --data-binary "@$APK_FILE" \
          "https://git.olli.info/api/v1/repos/Oliver/WeatherWall/releases/${RELEASE_ID}/assets?name=${APK_FILE}"
        
        DEBUG_APK="WeatherWall-v${VERSION}-debug.apk"
        if [ -f "$DEBUG_APK" ]; then
          curl -s -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$DEBUG_APK" \
            "https://git.olli.info/api/v1/repos/Oliver/WeatherWall/releases/${RELEASE_ID}/assets?name=${DEBUG_APK}"
        fi
        
        echo "Release v$VERSION published successfully!"
    when:
      - event: push
        branch: main
