[versions]
agp = "8.11.1"
# R8 bundled with AGP 8.11 reads Kotlin metadata up to 2.2; bump together with agp.
kotlin = "2.2.20"
coreKtx = "1.16.0"
appcompat = "1.7.1"
material = "1.12.0"
preference = "1.2.1"
# 1.11.0 is compiled with Kotlin 2.2.20, matching the pinned compiler.
coroutines = "1.11.0"
junit = "4.13.2"
mockito = "5.24.0"
robolectric = "4.17"
pitest = "1.30.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preference" }
material = { module = "com.google.android.material:material", version.ref = "material" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
pitest-command-line = { module = "org.pitest:pitest-command-line", version.ref = "pitest" }
pitest-entry = { module = "org.pitest:pitest-entry", version.ref = "pitest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
